name: Build Android APK & GitHub Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android con Health Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Android SDK 35 y aceptar licencias
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar Web & Servidor
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de depuración / prueba
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log
        continue-on-error: true

      - name: Verificar resultado de compilación
        run: |
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::Gradle assembleDebug falló."
            tail -n 120 build.log
            gh release create v1.3.0 build.log --title "NutriFit v1.3.0 — Error de compilación" --notes "Log de depuración" || gh release upload v1.3.0 build.log --clobber || true
            exit 1
          fi
          ls -la android/app/build/outputs/apk/debug/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir artefacto APK y logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nutrifit-android-build
          path: |
            build.log
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar Release en GitHub con APK directo
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.3
          name: 'NutriFit v1.5.3 — Icono v2 forzado para launcher de Android'
          allowUpdates: true
          body: |
            ### 📱 NutriFit v1.5.3 para Android
            
            Esta actualización fuerza la renovación del icono en la pantalla de inicio:
            - **Nuevo recurso `ic_launcher_v2`**: Invalida la caché del launcher de Samsung y Android para mostrar el icono del reloj de inmediato.
            - **Formato móvil nativo bloqueado**.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
