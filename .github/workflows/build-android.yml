name: Build Android APK & GitHub Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android con Health Connect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar dependencias npm
        run: npm ci

      - name: Compilar Web & Servidor
        run: npm run build

      - name: Sincronizar proyecto Android con Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK de depuración / prueba
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: nutrifit-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publicar Release en GitHub con APK directo
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: 'NutriFit v1.3.0 — APK con Contador de Pasos y Health Connect'
          allowUpdates: true
          body: |
            ### 📱 NutriFit v1.3.0 para Android
            
            Esta versión incluye la integración nativa con **Samsung Health**, **Health Connect** y sensores de pasos en Android.
            
            #### Novedades:
            - **Contador de Pasos**: Anillo de pasos en la pantalla «Hoy» colocado tras el agua.
            - **Samsung Health & Health Connect**: Lectura de pasos de solo lectura y sin duplicar pasos del reloj y teléfono.
            - **Gráficas de Pasos**: Vista de 7 y 30 días, media semanal, mejor día y racha en «Progreso».
            - **Descarga directa**: Descarga el archivo `app-debug.apk` abajo e instálalo en tu móvil Android.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
